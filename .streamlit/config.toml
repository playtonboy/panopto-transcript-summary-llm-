[server]
maxUploadSize = 5
# Only this computer can open the app (others on the same Wi-Fi cannot).
address = "localhost"

[browser]
# Do not send usage statistics to Streamlit's servers.
gatherUsageStats = false

[client]
# Hide the "Deploy" button: it offers to put the app on Streamlit's cloud, which this local app must not use.
toolbarMode = "viewer"
